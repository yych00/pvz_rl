name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install -e ".[train]"
      - name: Python checks
        run: |
          python -m compileall -q python train workbench scripts
          python -m unittest discover -s tests/smoke -t . -v
          python -m unittest discover -s tests/unit -t . -v
      - name: Native x64
        run: |
          cmake -S native -B build/native-x64 -A x64
          cmake --build build/native-x64 --config Release --parallel
          ctest --test-dir build/native-x64 -C Release --output-on-failure
      - name: Native x86
        run: |
          cmake -S native -B build/native-Win32 -A Win32
          cmake --build build/native-Win32 --config Release --parallel
          ctest --test-dir build/native-Win32 -C Release --output-on-failure
